<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App - Login/Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-header">
      <h2>Welcome to Chat</h2>
    </div>

    <div class="auth-tabs">
      <button id="login-tab" class="active" onclick="switchTab('login')">Login</button>
      <button id="register-tab" onclick="switchTab('register')">Register</button>
    </div>

    <div id="error-message" class="error-message"></div>

    <form id="auth-form" onsubmit="handleAuth(event)">
      <div id="username-group" class="input-group hidden">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username">
      </div>
      
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter email" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>

      <button type="submit" id="submit-btn" class="submit-btn">Login</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
